[project]
name = "enterprise-agentic-os"
version = "0.1.0"
description = "Local read-only company operations assistant foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "fastapi>=0.115,<1.0",
    "langchain-google-genai>=4.0,<5.0",
    "langchain-openai>=0.3.35,<2.0",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[build-system]
requires = ["hatchling>=1.26,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_os"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
